<body>
<div id="t"></div>
<div id="row" class="h"><span id="ps"></span><input id="in" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" aria-label="comando"></div>

<div id="dev" class="h"><div id="bar"><span id="url"></span><button id="x" aria-label="fechar">✕</button></div><div id="scr"><div id="sc2"><h1 id="st"></h1><i></i><i></i><i></i><div class="hero"></div><i></i><i></i></div></div><div id="pan"><div id="tabs"><span>Elements</span><span class="on">Console</span><span>Network</span></div><div id="log"></div><div id="crow"><span>&gt;</span><input id="ci" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" aria-label="console"></div></div></div>
<script>
const T=document.getElementById('t'),I=document.getElementById('in'),R=document.getElementById('row'),P=document.getElementById('ps');
const sleep=ms=>new Promise(r=>setTimeout(r,ms)),rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pick=a=>a[rnd(0,a.length-1)];
const ip=()=>[rnd(11,223),rnd(0,255),rnd(0,255),rnd(1,254)].join('.');
const hex=n=>Array.from({length:n},()=>rnd(0,15).toString(16)).join('');
const host=s=>(s||'').replace(/^[a-z]+:\/\//i,'').split('/')[0].toLowerCase();
const down=()=>window.scrollTo(0,document.body.scrollHeight);
function print(s='',c=''){const d=document.createElement('div');if(c)d.className=c;d.textContent=s;T.appendChild(d);down();return d}
async function seq(a,d=150){for(const l of a){print(l);await sleep(d/2+rnd(0,d))}}
async function typ(s,v=14){const d=print('');for(const c of s){d.textContent+=c;down();await sleep(v)}}
async function bar(l,ms=1400){const d=print(''),n=24;for(let i=0;i<=n;i++){d.textContent=l.padEnd(26,' ')+'['+'█'.repeat(i)+'░'.repeat(n-i)+'] '+String(Math.round(i/n*100)).padStart(3)+'%';down();await sleep(ms/n)}}

const BAN=[
'██╗  ██╗███╗   ██╗██████╗ ███████╗',
'╚██╗██╔╝████╗  ██║██╔══██╗╚══███╔╝',
' ╚███╔╝ ██╔██╗ ██║██║  ██║  ███╔╝ ',
' ██╔██╗ ██║╚██╗██║██║  ██║ ███╔╝  ',
'██╔╝ ██╗██║ ╚████║██████╔╝███████╗',
'╚═╝  ╚═╝╚═╝  ╚═══╝╚═════╝ ╚══════╝'].join('\n');

let mode='sh',busy=true,H=[],hi=0;
let RH='';const PS=()=>mode==='ia'?'ia>':RH?'root@'+RH+':~#':'root@xndz:~#';

/* ---------- mini IA ---------- */
const K0=[
[['oi','ola','opa','fala','salve','eai','eae'],['Fala, parceiro! Sistema online.','Salve! Em que posso ajudar?']],
[['quem','voce','nome'],['Sou a IA do XNDZ. Eu aprendo as palavras que você me ensinar.']],
[['hora','horas','dia','data'],['Agora são __time__.']],
[['tudo','bem','vai','como','esta'],['Tudo certo por aqui. Os servidores não dormem.']],
[['hack','hackear','invadir'],['Pra isso use o comando hack <site> no terminal.']],
[['obrigado','valeu','vlw'],['Tamo junto.']],
[['tchau','flw','ate'],['Até mais! Digite sair para voltar ao terminal.']]];
const fresh=()=>K0.map(r=>[r[0].slice(),r[1].slice()]);
let K;try{K=JSON.parse(localStorage.getItem('xndz_k'))}catch(e){}
if(!Array.isArray(K))K=fresh();
const save=()=>{try{localStorage.setItem('xndz_k',JSON.stringify(K))}catch(e){}};
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ');
async function ai(t){
 const w=norm(t).split(/\s+/).filter(Boolean);
 if(!w.length)return;
 if(w[0]==='sair'){mode='sh';return print('IA encerrada.')}
 if(w[0]==='regras'){K.forEach(r=>print('• '+r[0].join(', ')+'  →  '+r[1].length+' resposta(s)'));return}
 if(w[0]==='esquecer'){K=fresh();save();return print('Memória da IA reiniciada.')}
 if(w[0]==='ensinar'){
  const m=t.match(/^\s*ensinar\s+(.+?)\s*=\s*(.+)$/i);
  if(!m)return print('uso: ensinar palavra1,palavra2 = resposta');
  const ks=norm(m[1]).split(/\s+/).filter(Boolean);
  if(!ks.length)return print('uso: ensinar palavra1,palavra2 = resposta');
  const ex=K.find(r=>r[0].join()===ks.join());
  if(ex)ex[1].push(m[2].trim());else K.push([ks,[m[2].trim()]]);
  save();
  return print('ia> Aprendi! Quando você falar “'+ks.join(', ')+'” eu respondo isso.');
 }
 let best=0,c=[];
 for(const r of K){
  const s=r[0].filter(k=>w.some(x=>x===k||(k.length>3&&x.length>3&&(x.startsWith(k)||k.startsWith(x))))).length;
  if(s>best){best=s;c=[r]}else if(s===best&&s>0)c.push(r);
 }
 const rep=best?pick(pick(c)[1]).replace('__time__',new Date().toLocaleTimeString('pt-BR')):pick(['Não entendi essa. Me ensina: ensinar palavra = resposta','Ainda não conheço isso. Use: ensinar palavra1,palavra2 = resposta','Hmm... me ensina o que responder com o comando ensinar.']);
 await sleep(300);await typ('ia> '+rep);
}

/* ---------- comandos ---------- */
const PORTS=[[21,'ftp'],[22,'ssh'],[25,'smtp'],[53,'domain'],[80,'http'],[110,'pop3'],[443,'https'],[3306,'mysql'],[8080,'http-proxy']];

   const f=(kd.w||kd.arrowup?1:0)-(kd.s||kd.arrowdown?1:0),s=(kd.d||kd.arrowright?1:0)-(kd.a||kd.arrowleft?1:0),v=(kd[' ']||kd.u?1:0)-(kd.shift||kd.j?1:0);
   px+=(-Math.sin(yaw)*f+Math.cos(yaw)*s)*.09;pz+=(-Math.cos(yaw)*f-Math.sin(yaw)*s)*.09;py+=v*.09;
   cam.position.set(px,py,pz);cam.rotation.set(pit,yaw,0);ren.render(sc,cam);
  };
  loop();
  stopKeys=()=>{removeEventListener('keydown',key);removeEventListener('keyup',key)};
 };
 let stopKeys=()=>{};
 if(window.THREE)start();else{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';s.onload=start;s.onerror=()=>{bd.textContent='Não foi possível carregar o motor 3D.'};document.head.appendChild(s)}
 return()=>{alive=false;cancelAnimationFrame(raf);stopKeys();if(ren)ren.dispose()};
}

/* ---------- abrir, script e painel F12 ---------- */
const DV={open:false,h:'',s:{inv:0,gray:0,blur:0,arco:0}};
const SC={
inverter:`document.documentElement.style.filter='invert(1)'`,
cinza:`document.documentElement.style.filter='grayscale(1)'`,
borrar:`document.documentElement.style.filter='blur(3px)'`,
cor:`document.body.style.background='#000';document.body.style.color='#fff'`,
arco:`document.documentElement.animate([{filter:'hue-rotate(0deg)'},{filter:'hue-rotate(360deg)'}],{duration:4000,iterations:Infinity})`,
girar:`document.body.animate([{transform:'rotate(0deg)'},{transform:'rotate(360deg)'}],{duration:1500})`,
tremer:`document.body.animate([{transform:'translateX(-8px)'},{transform:'translateX(8px)'}],{duration:70,iterations:24,direction:'alternate'})`,
reset:`location.reload()`};
function showScript(a,out){
 const n=(a[0]||'').toLowerCase();
 if(!Object.prototype.hasOwnProperty.call(SC,n)){out('Scripts: '+Object.keys(SC).join(', '));out('uso: script <nome>');return}
 out('// '+n+' (cole no Console do F12)');out(SC[n],'cp');
}
function link(u){const d=document.createElement('div'),l=document.createElement('a');l.href=u;l.target='_blank';l.rel='noopener noreferrer';l.textContent=u;d.append('→ ',l);T.appendChild(d);down()}
const DE=document.getElementById('dev'),CI=document.getElementById('ci'),LG=document.getElementById('log'),SCR=document.getElementById('scr'),SC2=document.getElementById('sc2'),ST=document.getElementById('st');
function lg(s='',c=''){const d=document.createElement('div');if(c)d.className=c;d.textContent=s;LG.appendChild(d);LG.scrollTop=LG.scrollHeight;return d}
function fx(){const s=DV.s;SCR.style.filter=[s.inv&&'invert(1)',s.gray&&'grayscale(1)',s.blur&&'blur(3px)'].filter(Boolean).join(' ')||'none';SC2.classList.toggle('rb',!!s.arco)}
function anim(c,ms){SCR.classList.add(c);setTimeout(()=>SCR.classList.remove(c),ms)}
function openDev(h){DV.open=true;DV.h=h;DV.s={inv:0,gray:0,blur:0,arco:0};SCR.removeAttribute('style');fx();document.getElementById('url').textContent='https://'+h;ST.textContent=h;LG.innerHTML='';lg('Console pronto. Digite ajuda para ver os comandos.');DE.classList.remove('h')}
function closeDev(){DV.open=false;DE.classList.add('h');I.focus()}
function dcmd(t){
 lg('> '+t,'q');
 const a=t.trim().split(/\s+/),c=(a.shift()||'').toLowerCase(),s=DV.s,v=a.join(' ');
 if(!c)return;
 if(c==='ajuda'||c==='help')['cor <cor>       fundo da tela','texto <cor>     cor do texto','inverter        inverte as cores','cinza           preto e branco','borrar          desfoca a tela','arco            cores em movimento','girar, tremer   efeitos rápidos','titulo <texto>  muda o título','script <nome>   mostra um script','reset, sair'].forEach(x=>lg(x));
 else if(c==='cor'||c==='texto'){if(v&&CSS.supports('color',v)){SCR.style[c==='cor'?'background':'color']=v;lg('ok')}else lg('cor inválida: use red, #00ff88, rgb(0,0,0)')}
 else if(c==='inverter'){s.inv^=1;fx();lg('ok')}
 else if(c==='cinza'){s.gray^=1;fx();lg('ok')}
 else if(c==='borrar'){s.blur^=1;fx();lg('ok')}
 else if(c==='arco'){s.arco^=1;fx();lg('ok')}
 else if(c==='girar'){anim('spin',1000);lg('ok')}
 else if(c==='tremer'){anim('shk',1300);lg('ok')}
 else if(c==='titulo'){ST.textContent=v||DV.h;lg('ok')}
 else if(c==='script')showScript(a,lg);
 else if(c==='reset'){DV.s={inv:0,gray:0,blur:0,arco:0};SCR.removeAttribute('style');fx();ST.textContent=DV.h;lg('ok')}
 else if(c==='sair'||c==='exit'||c==='fechar')closeDev();
 else lg('Uncaught ReferenceError: '+c+' is not defined');
}
CI.addEventListener('keydown',e=>{if(e.key==='Enter'||e.keyCode===13){const v=CI.value;CI.value='';dcmd(v)}else if(e.key==='Escape')closeDev()});
document.getElementById('x').addEventListener('click',closeDev);
DE.addEventListener('click',e=>{if(e.target.closest('#pan')&&!String(getSelection()))CI.focus()});
CMD['hack+']=CMD['@hack+'];CMD.f12=CMD['@hack+'];CMD.open=CMD.abrir;

/* ---------- núcleo ---------- */
function ready(){busy=false;P.textContent=PS();R.classList.remove('h');if(!osOn&&!codeOn&&!blOn)(DV.open?CI:I).focus();down()}
async function boot(){
 busy=true;mode='sh';RH='';R.classList.add('h');T.innerHTML='';
 const b=document.createElement('pre');b.className='ban';b.textContent=BAN;T.appendChild(b);
 await sleep(500);
 await seq(['XNDZ-OS 6.1.0 (tty1)','','[  OK  ] Carregando módulos do kernel','[  OK  ] Iniciando interface de rede','[  OK  ] Montando sistema de arquivos','[  OK  ] Túnel criptografado ativo','[  OK  ] Modo furtivo ativado',''],160);
 print('Digite “help” para ver os comandos.');print('');
 ready();
}
async function run(line){
 busy=true;R.classList.add('h');
 print(PS()+' '+line);
 const t=line.trim();
 if(t)H.push(t);
 hi=H.length;
 try{
  if(mode==='ia'){await ai(t)}
  else if(t){
   const a=t.split(/\s+/),c=a.shift().toLowerCase();
   if(Object.prototype.hasOwnProperty.call(CMD,c))await CMD[c](a,t);
   else print('bash: '+c+': comando não encontrado');
  }
 }catch(e){}
 ready();
}
I.addEventListener('keydown',e=>{
 if((e.key==='Enter'||e.keyCode===13)&&!busy){const v=I.value;I.value='';run(v)}
 else if(e.key==='ArrowUp'){e.preventDefault();if(hi>0){hi--;I.value=H[hi]||''}}
 else if(e.key==='ArrowDown'){e.preventDefault();if(hi<H.length){hi++;I.value=H[hi]||''}}
 else if(e.key==='Tab'){e.preventDefault();const v=I.value;if(mode==='sh'&&v&&!v.includes(' ')){const m=Object.keys(CMD).filter(k=>k.startsWith(v));if(m.length===1)I.value=m[0]+' '}}
});
document.addEventListener('click',()=>{if(!busy&&!DV.open&&!osOn&&!codeOn&&!blOn&&!String(getSelection()))I.focus()});
boot();
</script>
